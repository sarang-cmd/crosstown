name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run assets:check
      - run: npm run check:versions
      - run: npm run build
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - run: xvfb-run -a npm run test:production
      - run: xvfb-run -a npm run test:city
  vehicles:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: xvfb-run -a npm run test:vehicles
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vehicle-acceptance
          path: |
            .arena/vehicle-browser-results.json
            .arena/vehicle-browser-results/
            docs/VEHICLE-*.json
            docs/screenshots/06-*.png
            docs/screenshots/07-*.png
  fleet:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20.20.2
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run accept:roster
      - run: npm run accept:traffic
      - run: xvfb-run -a npm run test:fleet
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fleet-acceptance
          path: |
            .arena/fleet-results.json
            .arena/fleet-results/
            docs/evidence/crosstown-0.9.0/
            docs/screenshots/08-*.png
            docs/screenshots/09-*.png
